name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: build-linux
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@main
        with:
          submodules: 'recursive'

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-ccache-launcher

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev qttools5-dev qttools5-dev-tools qt5-qmake g++ libxcb-xinerama0 libxcb-cursor0

      - name: Build
        run: |
          mkdir build
          cd build
          cmake \
           -DCMAKE_BUILD_TYPE=Release \
           -DLauncher_LAYOUT=lin-nodeps \
           -DLauncher_BUILD_PLATFORM=lin64 \
           -DLauncher_EMBED_SECRETS=On \
           -DCMAKE_C_COMPILER_LAUNCHER=ccache \
           -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
           $GITHUB_WORKSPACE

      - name: Compile
        run: |
          cd build
          make -j$(nproc)

      - name: Install
        run: |
          cd build
          cmake --install . --prefix ../AppDir

      - name: Package Dependencies
        run: |
          cd AppDir
          # Function to recursively collect all non-system .so deps of a binary
          collect_deps() {
            local target="$1"
            local deps=$(ldd "$target" 2>/dev/null | grep "=>" | awk '{print $3}')
            for lib in $deps; do
              [ -z "$lib" ] || [ ! -f "$lib" ] && continue
              local base=$(basename "$lib")
              # Skip core system libs
              case "$base" in
                linux-vdso.so*|ld-linux-x86-64.so*|libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libstdc++.so*|libgcc_s.so*) continue ;;
              esac
              if [ ! -f "bin/$base" ]; then
                cp -L "$lib" "bin/$base"
                echo "Copied: $base"
                # Recurse into this lib's deps too
                collect_deps "bin/$base"
              fi
            done
          }

          # Collect deps for the main executable
          collect_deps "bin/LauncherMC"

          # Collect deps for all bundled .so files
          for so in bin/*.so*; do
            [ -f "$so" ] && collect_deps "$so"
          done

          # Copy Qt plugins
          QT_PLUGINS=$(qmake -query QT_INSTALL_PLUGINS 2>/dev/null) || true
          echo "Qt plugins dir: $QT_PLUGINS"
          mkdir -p bin/plugins/platforms
          mkdir -p bin/plugins/imageformats
          mkdir -p bin/plugins/iconengines
          mkdir -p bin/plugins/platforminputcontexts

          [ -f "$QT_PLUGINS/platforms/libqxcb.so" ] && cp "$QT_PLUGINS/platforms/libqxcb.so" bin/plugins/platforms/
          [ -f "$QT_PLUGINS/imageformats/libqgif.so" ] && cp "$QT_PLUGINS/imageformats/libqgif.so" bin/plugins/imageformats/
          [ -f "$QT_PLUGINS/imageformats/libqico.so" ] && cp "$QT_PLUGINS/imageformats/libqico.so" bin/plugins/imageformats/
          [ -f "$QT_PLUGINS/imageformats/libqjpeg.so" ] && cp "$QT_PLUGINS/imageformats/libqjpeg.so" bin/plugins/imageformats/
          [ -f "$QT_PLUGINS/imageformats/libqsvg.so" ] && cp "$QT_PLUGINS/imageformats/libqsvg.so" bin/plugins/imageformats/
          [ -f "$QT_PLUGINS/iconengines/libqsvgicon.so" ] && cp "$QT_PLUGINS/iconengines/libqsvgicon.so" bin/plugins/iconengines/
          [ -f "$QT_PLUGINS/platforminputcontexts/libqibusplatforminputcontextplugin.so" ] && cp "$QT_PLUGINS/platforminputcontexts/libqibusplatforminputcontextplugin.so" bin/plugins/platforminputcontexts/
          [ -f "$QT_PLUGINS/platforminputcontexts/libfcitxplatforminputcontextplugin.so" ] && cp "$QT_PLUGINS/platforminputcontexts/libfcitxplatforminputcontextplugin.so" bin/plugins/platforminputcontexts/

          # Collect deps for all plugin .so files
          for plugin in bin/plugins/**/*.so bin/plugins/*.so; do
            [ -f "$plugin" ] && collect_deps "$plugin"
          done

          # Create qt.conf to point to our bundled plugins
          echo "[Paths]" > bin/qt.conf
          echo "Plugins=plugins" >> bin/qt.conf

          # Create launcher script
          cat > LauncherMC << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$(readlink -f "$0")")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$SCRIPT_DIR/bin/plugins"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$SCRIPT_DIR/bin/plugins/platforms"
          exec "$SCRIPT_DIR/bin/LauncherMC" "$@"
          EOF
          chmod +x LauncherMC

      - name: ccache stats
        run: ccache --show-stats

      - name: Upload Artifacts
        uses: actions/upload-artifact@main
        with:
          name: LauncherMC-linux64
          path: AppDir/

  build-windows:
    name: build-windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@main
        with:
          submodules: 'recursive'

      - name: Cache Qt
        uses: actions/cache@main
        id: qt-cached
        with:
          path: "D:/Qt"
          key: ${{ runner.os }}-qt563-mingw492-v3

      - name: Cache Qt Installer
        uses: actions/cache@main
        if: steps.qt-cached.outputs.cache-hit != 'true'
        id: installer-cached
        with:
          path: "installer.exe"
          key: ${{ runner.os }}-qt56-installer-v2

      - name: Create QtAccount File
        if: steps.qt-cached.outputs.cache-hit != 'true'
        run: |
          mkdir C:/Users/runneradmin/AppData/Roaming/Qt/
          curl -sL https://gist.github.com/Neptune650/1086e0a3126be6a66580b71afcf8bd99/raw/797d8b90edf07ce88f265b38a573cc6b1fb45bfb/qtaccount.txt --output C:/Users/runneradmin/AppData/Roaming/Qt/qtaccount.ini

      - name: Download Qt Installer
        if: steps.installer-cached.outputs.cache-hit != 'true' && steps.qt-cached.outputs.cache-hit != 'true'
        run: curl -sL https://download.qt.io/new_archive/qt/5.6/5.6.3/qt-opensource-windows-x86-mingw492-5.6.3.exe --output installer.exe

      - name: Download Qt non-Interactive Script
        if: steps.qt-cached.outputs.cache-hit != 'true'
        run: curl -sL https://gist.githubusercontent.com/Neptune650/aa6c051abc17e7d9d609add7f6dfd16a/raw/074dedb7525c0ffc010b39871615b008c2efbcd6/qt-installer-noninteractive.qs --output nonInteractive.qs

      - name: Install Qt
        if: steps.qt-cached.outputs.cache-hit != 'true'
        shell: cmd
        run: installer.exe --script nonInteractive.qs --silent

      - name: Setup CMake
        run: |
          curl -sL https://github.com/Kitware/CMake/releases/download/v3.30.4/cmake-3.30.4-windows-i386.zip -o cmake.zip
          unzip -q cmake.zip

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'
          architecture: x86

      - name: Setup zlib
        run: |
          mkdir zlib
          cd zlib
          curl -sL -o zlib.zip https://sourceforge.net/projects/gnuwin32/files/zlib/1.2.3/zlib-1.2.3-bin.zip/download
          curl -sL -o zliblibs.zip https://sourceforge.net/projects/gnuwin32/files/zlib/1.2.3/zlib-1.2.3-lib.zip/download
          unzip -q zlib.zip
          unzip -q zliblibs.zip

      - name: Setup OpenSSL
        run: |
          mkdir OpenSSL
          cd OpenSSL
          curl -sL https://files.catbox.moe/ctwswu.dll -o libeay32.dll
          curl -sL https://files.catbox.moe/ie9e77.dll -o ssleay32.dll

      - name: Build
        shell: cmd
        run: |
          for /f "tokens=*" %%n in ('powershell -NoLogo -Command "$(ls $pwd\cmake-*-windows-i386\bin).Fullname"') do @(set PATHCM=%%n)
          set PATH=D:\Qt\5.6.3\mingw49_32\bin;D:\Qt\Tools\mingw492_32\bin;
          set PATH=%CD%\zlib;%CD%\zlib\bin;%CD%\zlib\lib;%CD%\zlib\include;%PATH%
          set PATH=%CD%\OpenSSL;%PATH%
          set PATH=%PATHCM%;%PATH%
          mkdir build
          cd build
          cmake ^
           -DCMAKE_C_COMPILER=gcc ^
           -DCMAKE_CXX_COMPILER=g++ ^
           -DCMAKE_BUILD_TYPE=Release ^
           -DCMAKE_INSTALL_PREFIX:PATH="D:/LauncherMC" ^
           -DCMAKE_PREFIX_PATH="D:\Qt\5.6.3\mingw49_32" ^
           -DQt5_DIR="D:\Qt\5.6.3\mingw49_32" ^
           -DLauncher_LAYOUT=win-bundle ^
           -DLauncher_BUILD_PLATFORM=win32 ^
           -DLauncher_EMBED_SECRETS=On ^
           -G "MinGW Makefiles" ^
           ..

      - name: Compile
        shell: cmd
        run: |
          for /f "tokens=*" %%n in ('powershell -NoLogo -Command "$(ls $pwd\cmake-*-windows-i386\bin).Fullname"') do @(set PATHCM=%%n)
          set PATH=D:\Qt\5.6.3\mingw49_32\bin;D:\Qt\Tools\mingw492_32\bin;
          set PATH=%CD%\zlib;%CD%\zlib\bin;%PATH%
          set PATH=%CD%\OpenSSL;%PATH%
          set PATH=%PATHCM%;%PATH%
          set PATH=C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0;%PATH%
          cd build
          mingw32-make -j%NUMBER_OF_PROCESSORS%

      - name: Install
        shell: cmd
        run: |
          for /f "tokens=*" %%n in ('powershell -NoLogo -Command "$(ls $pwd\cmake-*-windows-i386\bin).Fullname"') do @(set PATHCM=%%n)
          set PATH=D:\Qt\5.6.3\mingw49_32\bin;D:\Qt\Tools\mingw492_32\bin;
          set PATH=%CD%\zlib;%CD%\zlib\bin;%PATH%
          set PATH=%CD%\OpenSSL;%PATH%
          set PATH=%PATHCM%;%PATH%
          cd build
          cmake --install .

      - name: Copy OpenSSL
        shell: cmd
        run: |
          copy OpenSSL\ssleay32.dll D:\LauncherMC\ssleay32.dll
          copy OpenSSL\libeay32.dll D:\LauncherMC\libeay32.dll

      - name: Copy Qt DLLs and Plugins
        shell: cmd
        run: |
          set PATH=D:\Qt\5.6.3\mingw49_32\bin;D:\Qt\Tools\mingw492_32\bin;%PATH%
          for /f "tokens=*" %%n in ('powershell -NoLogo -Command "$(ls $pwd\cmake-*-windows-i386\bin).Fullname"') do @(set PATHCM=%%n)
          set PATH=%PATHCM%;%PATH%
          set DEST=D:\LauncherMC
          copy D:\Qt\5.6.3\mingw49_32\bin\Qt5Core.dll %DEST%\
          copy D:\Qt\5.6.3\mingw49_32\bin\Qt5Gui.dll %DEST%\
          copy D:\Qt\5.6.3\mingw49_32\bin\Qt5Widgets.dll %DEST%\
          copy D:\Qt\5.6.3\mingw49_32\bin\Qt5Network.dll %DEST%\
          copy D:\Qt\5.6.3\mingw49_32\bin\Qt5Xml.dll %DEST%\
          copy D:\Qt\5.6.3\mingw49_32\bin\Qt5Concurrent.dll %DEST%\
          copy D:\Qt\5.6.3\mingw49_32\bin\Qt5Svg.dll %DEST%\
          copy D:\Qt\5.6.3\mingw49_32\bin\libgcc_s_dw2-1.dll %DEST%\
          copy D:\Qt\5.6.3\mingw49_32\bin\libstdc++-6.dll %DEST%\
          copy D:\Qt\5.6.3\mingw49_32\bin\libwinpthread-1.dll %DEST%\
          copy D:\Qt\Tools\mingw492_32\bin\libgcc_s_dw2-1.dll %DEST%\
          copy D:\Qt\Tools\mingw492_32\bin\libstdc++-6.dll %DEST%\
          copy D:\Qt\Tools\mingw492_32\bin\libwinpthread-1.dll %DEST%\
          mkdir %DEST%\platforms
          copy D:\Qt\5.6.3\mingw49_32\plugins\platforms\qwindows.dll %DEST%\platforms\
          mkdir %DEST%\imageformats
          copy D:\Qt\5.6.3\mingw49_32\plugins\imageformats\qgif.dll %DEST%\imageformats\
          copy D:\Qt\5.6.3\mingw49_32\plugins\imageformats\qico.dll %DEST%\imageformats\
          copy D:\Qt\5.6.3\mingw49_32\plugins\imageformats\qjpeg.dll %DEST%\imageformats\
          copy D:\Qt\5.6.3\mingw49_32\plugins\imageformats\qsvg.dll %DEST%\imageformats\
          mkdir %DEST%\iconengines
          copy D:\Qt\5.6.3\mingw49_32\plugins\iconengines\qsvgicon.dll %DEST%\iconengines\

      - name: Upload Artifacts
        uses: actions/upload-artifact@main
        with:
          name: LauncherMC-win32
          path: "D:/LauncherMC"
