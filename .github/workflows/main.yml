name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: build-linux
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@main
        with:
          submodules: 'recursive'

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-ccache-launcher

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev qttools5-dev g++

      - name: Build
        run: |
          mkdir build
          cd build
          cmake \
           -DCMAKE_BUILD_TYPE=Release \
           -DLauncher_LAYOUT=lin-nodeps \
           -DLauncher_BUILD_PLATFORM=lin64 \
           -DLauncher_EMBED_SECRETS=On \
           -DCMAKE_C_COMPILER_LAUNCHER=ccache \
           -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
           $GITHUB_WORKSPACE

      - name: Compile
        run: |
          cd build
          make -j$(nproc)

      - name: ccache stats
        run: ccache --show-stats

      - name: Upload Artifacts
        uses: actions/upload-artifact@main
        with:
          name: LauncherMC-linux64
          path: "build/LauncherMC"

  build-windows:
    name: build-windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@main
        with:
          submodules: 'recursive'

      - name: Cache Qt
        uses: actions/cache@main
        id: qt-cached
        with:
          path: "D:/Qt"
          key: ${{ runner.os }}-qt563-mingw492-v3

      - name: Cache Qt Installer
        uses: actions/cache@main
        if: steps.qt-cached.outputs.cache-hit != 'true'
        id: installer-cached
        with:
          path: "installer.exe"
          key: ${{ runner.os }}-qt56-installer-v2

      - name: Create QtAccount File
        if: steps.qt-cached.outputs.cache-hit != 'true'
        run: |
          mkdir C:/Users/runneradmin/AppData/Roaming/Qt/
          curl -sL https://gist.github.com/Neptune650/1086e0a3126be6a66580b71afcf8bd99/raw/797d8b90edf07ce88f265b38a573cc6b1fb45bfb/qtaccount.txt --output C:/Users/runneradmin/AppData/Roaming/Qt/qtaccount.ini

      - name: Download Qt Installer
        if: steps.installer-cached.outputs.cache-hit != 'true' && steps.qt-cached.outputs.cache-hit != 'true'
        run: curl -sL https://download.qt.io/new_archive/qt/5.6/5.6.3/qt-opensource-windows-x86-mingw492-5.6.3.exe --output installer.exe

      - name: Download Qt non-Interactive Script
        if: steps.qt-cached.outputs.cache-hit != 'true'
        run: curl -sL https://gist.githubusercontent.com/Neptune650/aa6c051abc17e7d9d609add7f6dfd16a/raw/074dedb7525c0ffc010b39871615b008c2efbcd6/qt-installer-noninteractive.qs --output nonInteractive.qs

      - name: Install Qt
        if: steps.qt-cached.outputs.cache-hit != 'true'
        shell: cmd
        run: installer.exe --script nonInteractive.qs --silent

      - name: Setup CMake
        run: |
          curl -sL https://github.com/Kitware/CMake/releases/download/v3.30.4/cmake-3.30.4-windows-i386.zip -o cmake.zip
          unzip -q cmake.zip

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'
          architecture: x86

      - name: Setup zlib
        run: |
          mkdir zlib
          cd zlib
          curl -sL -o zlib.zip https://downloads.sourceforge.net/project/gnuwin32/zlib/1.2.3/zlib-1.2.3-bin.zip
          curl -sL -o zliblibs.zip https://downloads.sourceforge.net/project/gnuwin32/zlib/1.2.3/zlib-1.2.3-lib.zip
          unzip -q zlib.zip
          unzip -q zliblibs.zip

      - name: Setup OpenSSL
        run: |
          mkdir OpenSSL
          cd OpenSSL
          curl -sL https://files.catbox.moe/ctwswu.dll -o libeay32.dll
          curl -sL https://files.catbox.moe/ie9e77.dll -o ssleay32.dll

      - name: Build
        shell: cmd
        run: |
          for /f "tokens=*" %%n in ('powershell -NoLogo -Command "$(ls $pwd\cmake-*-windows-i386\bin).Fullname"') do @(set PATHCM=%%n)
          set PATH=D:\Qt\5.6.3\mingw49_32\bin;D:\Qt\Tools\mingw492_32\bin;
          set PATH=%CD%\zlib;%CD%\zlib\bin;%CD%\zlib\lib;%CD%\zlib\include;%PATH%
          set PATH=%CD%\OpenSSL;%PATH%
          set PATH=%PATHCM%;%PATH%
          mkdir build
          cd build
          cmake ^
           -DCMAKE_C_COMPILER=gcc ^
           -DCMAKE_CXX_COMPILER=g++ ^
           -DCMAKE_BUILD_TYPE=Release ^
           -DCMAKE_INSTALL_PREFIX:PATH="D:/LauncherMC" ^
           -DCMAKE_PREFIX_PATH="D:\Qt\5.6.3\mingw49_32" ^
           -DQt5_DIR="D:\Qt\5.6.3\mingw49_32" ^
           -DLauncher_LAYOUT=win-bundle ^
           -DLauncher_BUILD_PLATFORM=win32 ^
           -DLauncher_EMBED_SECRETS=On ^
           -G "MinGW Makefiles" ^
           ..

      - name: Compile
        shell: cmd
        run: |
          for /f "tokens=*" %%n in ('powershell -NoLogo -Command "$(ls $pwd\cmake-*-windows-i386\bin).Fullname"') do @(set PATHCM=%%n)
          set PATH=D:\Qt\5.6.3\mingw49_32\bin;D:\Qt\Tools\mingw492_32\bin;
          set PATH=%CD%\zlib;%CD%\zlib\bin;%PATH%
          set PATH=%CD%\OpenSSL;%PATH%
          set PATH=%PATHCM%;%PATH%
          set PATH=C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0;%PATH%
          cd build
          mingw32-make -j%NUMBER_OF_PROCESSORS%

      - name: Install
        shell: cmd
        run: |
          mkdir D:\LauncherMC\LauncherMC
          copy build\LauncherMC.exe D:\LauncherMC\LauncherMC\LauncherMC.exe
          copy D:\Qt\5.6.3\mingw49_32\bin\Qt5Core.dll D:\LauncherMC\LauncherMC\
          copy D:\Qt\5.6.3\mingw49_32\bin\Qt5Gui.dll D:\LauncherMC\LauncherMC\
          copy D:\Qt\5.6.3\mingw49_32\bin\Qt5Widgets.dll D:\LauncherMC\LauncherMC\
          copy D:\Qt\5.6.3\mingw49_32\bin\Qt5Network.dll D:\LauncherMC\LauncherMC\
          copy D:\Qt\5.6.3\mingw49_32\bin\Qt5Xml.dll D:\LauncherMC\LauncherMC\
          copy D:\Qt\5.6.3\mingw49_32\bin\Qt5Svg.dll D:\LauncherMC\LauncherMC\
          copy D:\Qt\Tools\mingw492_32\bin\libgcc_s_dw2-1.dll D:\LauncherMC\LauncherMC\
          copy D:\Qt\Tools\mingw492_32\bin\libstdc++-6.dll D:\LauncherMC\LauncherMC\
          copy D:\Qt\Tools\mingw492_32\bin\libwinpthread-1.dll D:\LauncherMC\LauncherMC\
          mkdir D:\LauncherMC\LauncherMC\platforms
          copy D:\Qt\5.6.3\mingw49_32\plugins\platforms\qwindows.dll D:\LauncherMC\LauncherMC\platforms\
          mkdir D:\LauncherMC\LauncherMC\imageformats
          copy D:\Qt\5.6.3\mingw49_32\plugins\imageformats\qsvg.dll D:\LauncherMC\LauncherMC\imageformats\

      - name: Copy OpenSSL
        shell: cmd
        run: |
          copy OpenSSL\ssleay32.dll D:\LauncherMC\LauncherMC\ssleay32.dll
          copy OpenSSL\libeay32.dll D:\LauncherMC\LauncherMC\libeay32.dll

      - name: Upload Artifacts
        uses: actions/upload-artifact@main
        with:
          name: LauncherMC-win32
          path: "D:/LauncherMC"
